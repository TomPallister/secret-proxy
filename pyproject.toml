[project]
name = "secret-proxy"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mitmproxy==12.3.1",
]

[dependency-groups]
dev = [
  "botocore==1.43.81",
  "ruff==0.16.4",
]

[tool.uv]
package = false
# Security compatibility override: upstream caps Tornado at vulnerable 6.5.10.
# Only the headless mitmdump entrypoint is supported; see docs/dependency-audit.md.
# Remove this override when upstream admits the patched version.
override-dependencies = ["tornado==6.6.1"]
